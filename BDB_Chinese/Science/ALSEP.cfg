// Gamedata/Bluedog_DB/Resources/Scidef_bd_ALSEP_UVscope.cfg
@EXPERIMENT_DEFINITION:HAS[#id[bd_ALSEP_UVscope]]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = 紫外望远镜观测
    @RESULTS
    {
        @default,0 = 你拍摄了多个天文目标，记录下年轻星团中炽热明亮的恒星、超新星留下的气体遗迹，以及行星上若隐若现的奇异结构。
        @KerbinSrfLanded,0 = 这台望远镜是为太空观测设计的，不过你觉得换上一次性相机的胶片，也许就能拍些可见光风景照。事实证明，你想错了。你决定，下次来这里时带一台观景望远镜、一支长焦镜头，或者至少带一副像样的双筒望远镜。
        @MunSrfLanded,0 = 借助内置数字刻度盘和小型寻星镜，远紫外相机对准了 Kerbin。照片中，Kerbin 的外层大气呈现出明亮的光晕，形成了“Kerbin 冕”。真奇怪——此前人们一直认为，Kerbin 的大气层恰好终止于 70 千米高度，而这片光晕竟延伸至 15 个 Kerbin 半径之外，也就是 9,000 千米。太阳辐射激发的气辉照亮了 Kerbin 朝向太阳的半球，极光区和两条赤道气辉带也清晰可见。相机还拍摄了多个其他天文目标；在观测邻近星系的恒星形成区时，它的表现远胜可见光摄影。
        @MinmusSrfLanded,0 = 远紫外相机从 Minmus 表面对准 Kerbin 和 Mun，研究 Kerbin 冕、磁尾与 Mun 之间的相互作用。长时间曝光显示，Mun 上存在微弱的辉光。仪器还探测并研究了太阳冕和恒星风，发现了很强的“氦”发射谱线。实验室的人说，他们从没听说过氦，也许这是一种只存在于太空中的全新元素。结论还很初步，但足够令人兴奋。
        @MohoSrfLanded,0 = 加装专用滤光片后，远紫外相机拍下了太阳圆面的高分辨率细节：翻涌不息的谱斑，甚至还有一些暗条和日珥。将相机转向背离太阳的方向后，它又分辨出了 Moho 彗尾状尾迹中富含钠的光谱。
        @GillySrfLanded,0 = 远紫外相机拍摄了 Eve，揭示出一片明亮的电离粒子光晕。这些粒子正随太阳风从 Eve 逃逸。Eve 上几乎一切都紫得出奇，因此在紫外波段发现有趣现象，倒也不让人意外！
        @EveSrfLanded,0 = 行星紫得再厉害，也不代表紫外相机就能在这里工作！好吧，现在我们知道远紫外辐射无法穿透 Eve 的大气了，真了不起。可你本来完全可以送来一台光度计，何必动用昂贵的镀金天文相机！这台仪器明明有那么多更好的去处：装到空间站的太阳望远镜支架上，或是送到 Eve 的卫星上回望母星，都比这里强。
        @DunaSrfLanded,0 = Duna 大气中的尘埃阻挡了大部分远紫外辐射。不过，长时间曝光仍能捕捉到 Ike 的微弱辉光，尤其是在它呈现满相时。这似乎暗示，Ike 与 Duna 冕之间存在某种相互作用。
        @IkeSrfLanded,0 = 仪器观测了几个遥远的天文目标，不过最引人注目的还是 Duna。高层大气中的电离粒子被太阳风吹离，形成了几乎充满相机视野的巨大光晕。看来在某些时刻，Duna 的高层大气甚至会直接与 Ike 相互作用。
        @DresSrfLanded,0 = 附近没有其他可观测的天体，远紫外相机便专门对准遥远目标，逐步拼出全天图景。从这一遥远位置获取的数据，将有助于绘制银河恒星形成区，并确定年轻高温恒星的光谱分类——等等，天哪，天空中那道散射着光芒的暗淡尘埃弧是什么？Dres 周围似乎存在某种碎屑盘！
        @LaytheSrfLanded,0 = 紫外辐射无法穿透 Laythe 的大气。不过，好消息是凝结的水汽让金色外壳显得格外闪亮！
        @JoolSrfLanded,0 = 冷知识：紫外辐射无法穿透绿色云层。
        @VallSrfLanded,0 = 远紫外相机对准了 Jool 系统的各颗卫星。Laythe 的外逸层呈现为结构复杂的发光晕，并平滑地融入环绕其轨道的一圈异常明亮的气体环。奇怪的是，Tylo 看似没有大气，却也拥有相当明亮的光晕，仿佛存在与 Laythe 和 Kerbin 类似的外逸层。Jool 的大气则被壮观而迅速变化的极光照得绚丽夺目。
        @TyloSrfLanded,0 = 远紫外相机对准了 Jool 系统的各颗卫星。Laythe 的外逸层呈现为结构复杂的发光晕，并平滑地融入环绕其轨道的一圈异常明亮的气体环。Vall 对应的气体环明显更暗，其中有几处显著“热点”，或许与其地壳中的低洼区域有关。Jool 的大气则被壮观而迅速变化的极光照得绚丽夺目。
        @BopSrfLanded,0 = 远紫外相机对准了 Jool 系统的各颗卫星。Laythe 的外逸层呈现为结构复杂的发光晕，并平滑地融入环绕其轨道的一圈异常明亮的气体环。Vall 对应的气体环明显更暗，其中有几处显著“热点”，或许与其地壳中的低洼区域有关。Tylo 也拥有相当明亮的光晕，仿佛存在与 Laythe 和 Kerbin 类似的外逸层。Jool 的大气则被壮观而迅速变化的极光照得绚丽夺目。
        @PolSrfLanded,0 = 远紫外相机对准了 Jool 系统的各颗卫星。Laythe 的外逸层呈现为结构复杂的发光晕，并平滑地融入环绕其轨道的一圈异常明亮的气体环。Vall 对应的气体环明显更暗，其中有几处显著“热点”，或许与其地壳中的低洼区域有关。Tylo 也拥有相当明亮的光晕，仿佛存在与 Laythe 和 Kerbin 类似的外逸层。Jool 的大气则被壮观而迅速变化的极光照得绚丽夺目。从这条遥远轨道上，还能隐约看见 Jool 冕：恒星风流、弓形磁场与气体环的相互作用交织成复杂的网络。Bop 的光谱看起来很不对劲，但你一时又说不出哪里有问题。
        @EelooSrfLanded,0 = 远离太阳后，相机装上了专用日冕滤光片，准备以超长曝光拍摄整个 Kerbol 系统中的太阳风。行星磁场之间的相互作用，在细微的明暗纹理中显现出来。银河中的恒星形成区构成明亮而斑驳的背景，要从中分离出更暗的日冕外流，还需要下不少工夫。不过，在这么遥远的地方……你有的是时间。
    }
}

