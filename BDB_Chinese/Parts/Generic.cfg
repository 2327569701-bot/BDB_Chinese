// Gamedata/Bluedog_DB/Parts/Generic/bluedog_SpinDecoupler_p3125m.cfg
@PART[bluedog_SpinDecoupler_p3125m]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = 0.3125m 自旋发动机分离器
    @manufacturer = Bluedog 设计局
    @description = 0.3125m 起旋发动机。分离后，两台相对布置的发动机可使小型载荷旋转起来。<#ef7b06>操作步骤：1）安装在固体火箭发动机底部。2）利用带姿态控制的火箭级保持所需朝向，确保飞船稳定。3）关闭 SAS，再触发分离器分级，使其与下方部件分离并点燃起旋发动机。4）固体发动机进入自旋稳定后，通过右键菜单中的 Jettison（抛离）或动作组，手动将起旋转台与固体发动机分离。5）点燃固体发动机。6）大功告成。建议在燃烧结束后使用 BDB 悠悠式消旋装置降低转速。使用本部件不需要 Mandatory RCS 或 Persistent Rotation 模组；若希望载荷在整个任务期间保持自旋稳定，则建议安装。</color>
    @MODULE[ModuleB9AssignUiGroups]
    {
        @MODULE,0
        {
            @uiGroupDisplayName = 抛离（顶部节点）
        }
        @MODULE,1
        {
            @uiGroupDisplayName = 分离（底部节点）
        }
        @MODULE,2
        {
            @uiGroupDisplayName = 自旋发动机
        }
    }
    @tags ^= :$: 通用 结构 自旋发动机分离器:
}

