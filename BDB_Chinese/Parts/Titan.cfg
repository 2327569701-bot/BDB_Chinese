    @description = Prometheus 使用的 1.875m 捆绑固体助推器，提供多种长度。通常先在发射台点火，在燃尽前 10 秒点燃芯级液体发动机。当然，你也不一定非要遵循惯例。带有中止模式，默认由“中止”动作组触发。\nB9PartSwitch：此部件可在零件操作菜单中切换发动机构型，部分构型需要通过升级解锁。
    @MODULE[MultiModeEngine]
    {
        @primaryEngineModeDisplayName = 助推
        @secondaryEngineModeDisplayName = 中止
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
    {
        @switcherDescription = 发动机构型
        @switcherDescriptionPlural = 发动机构型
        %uiGroupDisplayName = 部件切换
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchType]]
    {
        @switcherDescription = 类型
        @switcherDescriptionPlural = 类型
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[Radial]
        {
            %title = 径向
        }
        @SUBTYPE[Inline]
        {
            %title = 轴向
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[textureSwitchBody]]
    {
        @uiGroupDisplayName = 涂装切换
        @switcherDescription = 涂装
        @switcherDescriptionPlural = 涂装
        @SUBTYPE[Striped]
        {
            %title = 条纹
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[textureSwitchTVC]]
    {
        @uiGroupDisplayName = 涂装切换
        @switcherDescription = 推力矢量控制液贮箱
        @switcherDescriptionPlural = 推力矢量控制液贮箱
        @SUBTYPE[Red]
        {
            %title = 红色
        }
    }
    @tags ^= :$: 大力神 运载火箭 固体火箭助推器:
