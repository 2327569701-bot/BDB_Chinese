// Gamedata/Bluedog_DB/Parts/ProbeExpansion/Ranger/bluedog_Mariner2_Solar_Antenna.cfg
@PART[bluedog_Mariner2_Solar_Antenna]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Argo-2-ASP 折叠式太阳能电池板与天线
    @manufacturer = Bluedog 设计局
    @description = 结构简单的早期廉价太阳能电池板，可折叠收纳进整流罩，不能跟踪太阳。可在标准倾斜折叠与竖直收纳姿态之间切换。此构型集成低功率全向天线，以维持与母星的联系。
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchFold]]
    {
        @switcherDescription = 折叠方式
        @switcherDescriptionPlural = 折叠方式
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[Angled]
        {
            %title = 倾斜
        }
        @SUBTYPE[Straight]
        {
            %title = 直线型
        }
        @SUBTYPE[Angled??Reversed?]
        {
            %title = 倾斜（反向）
        }
        @SUBTYPE[Straight??Reversed?]
        {
            %title = Straight（反向）
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchExtension]]
    {
        @switcherDescription = 加长段
        @switcherDescriptionPlural = 加长段
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[None]
        {
            @descriptionDetail = <b>发电速率:</b> 0.4 Ec/s
            %title = 无
        }
        @SUBTYPE[Extension]
        {
            @descriptionDetail = <b>发电速率:</b> 0.5 Ec/s (<#33ff33>+0.1</color>)
            %title = 加长段
        }
        @SUBTYPE[Sail]
        {
            @descriptionDetail = <b>发电速率:</b> 0.4 Ec/s
            %title = 帆板
        }
    }
    @tags ^= :$: 探测器 卫星 折叠式太阳能电池板与天线:
}

