// Gamedata/Bluedog_DB/Parts/ProbeExpansion/AIMP/bluedog_AIMP_Magnetometer.cfg
@PART[bluedog_AIMP_Magnetometer]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = MIP-FMP 折叠式磁强计伸杆
    @manufacturer = Bluedog 设计局
    @description = 用于测量行星磁场的仪器。与常见磁强计不同，它采用折叠而非伸缩方式收纳，虽然更难装入整流罩，却更轻巧。足够机灵的飞行员甚至可以用它扶正侧翻的着陆器，不过不建议这样做。
    @MODULE[ModuleB9AssignUiGroups]
    {
        @MODULE
        {
            @uiGroupDisplayName = 扫描仪
        }
    }
    @MODULE[DMModuleScienceAnimateGeneric]:HAS[#experimentID[bd_magScan]]
    {
        @endEventGUIName = 收回
        @startEventGUIName = 展开
        @toggleEventGUIName = 切换
        @collectActionName = 收集数据
        @experimentActionName = 记录磁强计数据
        @resetActionName = 重置实验
        @reviewActionName = 查看数据
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchAttach]]
    {
        @switcherDescription = 连接方式
        @switcherDescriptionPlural = 连接方式
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[Top]
        {
            %title = 顶部
        }
        @SUBTYPE[Horizontal]
        {
            %title = 水平
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchDeploy]]
    {
        @switcherDescription = 展开
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[Straight]
        {
            %title = 直线型
        }
        @SUBTYPE[Angled]
        {
            %title = 倾斜
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchStyle]]
    {
        @switcherDescription = 样式
        %uiGroupDisplayName = 部件切换
    }
    @tags ^= :$: 探测器 卫星 折叠式磁强计伸杆:
}

