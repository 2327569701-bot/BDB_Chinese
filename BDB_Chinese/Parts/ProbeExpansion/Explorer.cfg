// Gamedata/Bluedog_DB/Parts/ProbeExpansion/Explorer/bluedog_Explorer_Star17.cfg
@PART[bluedog_Explorer_Star17]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Staara-17 "Longinus" 固体火箭发动机
    @manufacturer = Bluedog 设计局
    @description = Staara 系列 17 型固体火箭发动机，采用真空优化喷管，比液体推进装置更简单可靠，附带 0.3125m 安装结构。可升级为 17-A 型，略微提高推力和比冲，并增加固体推进剂装量。配备 BDB 的 SafeSolid™ 系统，可在飞行中关机，以便更精确地完成入轨和轨道机动。\nB9PartSwitch：此部件可在零件操作菜单中切换发动机构型，部分构型需要通过升级解锁。
