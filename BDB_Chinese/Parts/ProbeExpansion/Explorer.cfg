    @manufacturer = Bluedog 设计局
    @description = REI（Radio Exploratory Investigator）射电天文观测卫星的核心。虽然尺寸不大，功能却相当齐全，重量也颇为可观。内置小型磁稳定系统、SAS 和电池。最初面向 Kerbin 轨道任务，也可升级为携带少量单组元推进剂的构型，以执行 Mun 任务。
    @MODULE[ModuleCommand]
    {
        @defaultControlPointDisplayName = 前向
        @CONTROLPOINT[reverse]
        {
            @displayName = 反向
        }
    }
    @MODULE[ModuleSAS]
    {
        @UPGRADES
        {
            @UPGRADE,0
            {
                @description__ = SAS 升级
            }
            @UPGRADE,1
            {
                @description__ = SAS 升级
            }
            @UPGRADE,2
            {
                @description__ = SAS 升级
            }
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchConfiguration]]
    {
        @switcherDescription = 构型
        @switcherDescriptionPlural = 构型
        %uiGroupDisplayName = 部件切换
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchEndcap]]
    {
        @switcherDescription = 端盖
        @switcherDescriptionPlural = 端盖
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[Recessed]
        {
            %title = 凹入式
        }
        @SUBTYPE[Filled]
        {
            %title = 封闭式
        }
    }
    @tags ^= :$: 探测器 卫星 探测器核心:
}

