        @SUBTYPE[Star17]
        {
            @title = Staara-17 "Longinus" 固体火箭发动机
            @descriptionSummary = 结构简单、性能可靠的固体变轨发动机。
        }
        @SUBTYPE[Star17A]
        {
            @title = Staara-17A "Longinus" 固体火箭发动机
            @descriptionSummary = 结构简单、性能可靠的固体变轨发动机。
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchTop]]
    {
        @switcherDescription = 顶部转接段
        @switcherDescriptionPlural = 顶部转接段
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[No?Adapter]
        {
            %title = 无转接段
        }
        @SUBTYPE[0.125m?Top]
        {
            %title = 0.125m 顶部
        }
    }
    @tags ^= :$: 探测器 卫星 固体火箭发动机:
}

