// Gamedata/Bluedog_DB/Parts/ProbeExpansion/Explorer/bluedog_RAE_ProbeCore.cfg
@PART[bluedog_RAE_ProbeCore]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
