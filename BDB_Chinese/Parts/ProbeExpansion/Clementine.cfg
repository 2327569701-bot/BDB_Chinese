// Gamedata/Bluedog_DB/Parts/ProbeExpansion/Clementine/bluedog_Clementine_Sensors.cfg
@PART[bluedog_Clementine_Sensors]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Tangerine-SDI23-AIO 成像传感器平台
    @manufacturer = Bluedog 设计局
    @description = 堪称成像技术精华的尖端科学平台，利用机密政府技术验证最新成像系统在长期太空任务中的表现，最终成为迄今最先进的测绘相机之一。这套小型仪器可拍摄可见光、近红外、长波红外和紫外图像，并通过激光雷达获取地形高程数据。不过，紧凑设计略微限制了部分红外和紫外成像能力。与 Tangerine-SDI23 卫星配套使用。
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[bd_camera]]
    {
        @experimentActionName = 获取高分辨率图像
        @resetActionName = 删除数据
        @collectActionName = 收集数据
    }
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[bd_IRspec]]
    {
        @experimentActionName = 获取长波红外图像
        @resetActionName = 删除数据
        @collectActionName = 收集数据
    }
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[bd_IRradiometer]]
    {
        @experimentActionName = 获取近红外图像
        @resetActionName = 删除数据
        @collectActionName = 收集数据
    }
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[bd_UVspec]]
    {
        @experimentActionName = 获取紫外图像
        @resetActionName = 删除数据
        @collectActionName = 收集数据
    }
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[bd_radarAltimeter]]
    {
        @experimentActionName = 采集激光雷达测高数据
        @resetActionName = 删除数据
        @collectActionName = 收集数据
    }
    @MODULE[ModuleAnimateGeneric]:HAS[#animationName[deploy]]
    {
        @startEventGUIName = 展开
        @endEventGUIName = 收回
        @actionGUIName = 切换
    }
    @tags ^= :$: 探测器 卫星 成像传感器平台:
}

