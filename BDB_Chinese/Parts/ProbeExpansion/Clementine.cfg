// Gamedata/Bluedog_DB/Parts/ProbeExpansion/Clementine/bluedog_Clementine_Bus.cfg
@PART[bluedog_Clementine_Bus]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Tangerine-SDI23 "Citron" 卫星平台
    @manufacturer = Bluedog 设计局
    @description = 一家行事神秘的政府机构与 Bluedog 设计局合作制造的通用、坚固探测器平台，用于验证多种尖端航天技术。内部携带充足推进剂，集成两副低增益天线及带电粒子望远镜实验。<#ef7b06>作者提示：加装 Tangerine-SDI23 “Compass”恒星跟踪器，即可获得更多 SAS 模式。</color>
    @MODULE[ModuleCommand]
    {
        @defaultControlPointDisplayName = 前向
        @CONTROLPOINT[reverse]
        {
            @displayName = 反向
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[textureSwitchPaint]]
    {
        @uiGroupDisplayName = 涂装切换
        @switcherDescription = 隔热箔
        @switcherDescriptionPlural = 隔热箔
        @SUBTYPE[Gold?MLI]
        {
            %title = 金色多层隔热层
        }
        @SUBTYPE[Silver?MLI]
        {
            %title = 银色多层隔热材料
        }
    }
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[logIonTrap]]
    {
        @experimentActionName = 记录带电粒子
        @resetActionName = 删除数据
        @collectActionName = 获取数据
    }
    @MODULE[ModuleB9AssignUiGroups]
    {
        @MODULE
        {
            @uiGroupDisplayName = 科学实验
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchProbeTag]]
    {
        @switcherDescription = 探测器标牌
        @switcherDescriptionPlural = 探测器标牌
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[Yes]
        {
            %title = 有
        }
        @SUBTYPE[no]
        {
            %title = 无
        }
    }
    @tags ^= :$: 探测器 卫星 卫星平台:
}

