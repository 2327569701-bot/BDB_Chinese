// Gamedata/Bluedog_DB/Parts/ProbeExpansion/Clementine/bluedog_Clementine_ISAS.cfg
@PART[bluedog_Clementine_ISAS]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Tangerine-SDI23 "ISA" 转接段
    @manufacturer = Bluedog 设计局
    @description = 工程师意识到，用完的固体末级不必只是废弃物，也可以变成一颗辅助卫星！ISA 为 Tangerine-SDI23 卫星的加速级设计，固定安装在 Staara-37 固体发动机上。它拥有独立探测器核心和太阳能电池板，集成辐射监测实验及微流星体／碎片撞击探测实验。顶部设有分离器，用于释放主载荷。但 ISA 采用自旋稳定，不具备 SAS 控制，也没有内置天线；ISA 鞭状天线需单独安装。
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[bd_GeigerCounter]]
    {
        @experimentActionName = 记录辐射
        @resetActionName = 丢弃辐射数据
        @collectActionName = 采集辐射数据
    }
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[logmmImpacts]]
    {
        @experimentActionName = 记录撞击
        @resetActionName = 丢弃撞击数据
        @collectActionName = 采集撞击数据
    }
    @MODULE[ModuleB9AssignUiGroups]
    {
        @MODULE,0
        {
            @uiGroupDisplayName = 科学实验
        }
        @MODULE,1
        {
            @uiGroupDisplayName = 科学实验
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[textureSwitchPaint]]
    {
        @uiGroupDisplayName = 涂装切换
        @switcherDescription = 涂装
        @switcherDescriptionPlural = 涂装
        @SUBTYPE[Silver?MLI]
        {
            %title = 银色多层隔热材料
        }
        @SUBTYPE[Gold?MLI]
        {
            %title = 金色多层隔热层
        }
    }
    @tags ^= :$: 探测器 卫星 转接段:
}

