        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchFold]]
    {
        @switcherDescription = 折叠方式
        @switcherDescriptionPlural = 折叠方式
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[Angled]
        {
            %title = 倾斜
        }
        @SUBTYPE[Straight]
        {
            %title = 直线型
        }
    }
