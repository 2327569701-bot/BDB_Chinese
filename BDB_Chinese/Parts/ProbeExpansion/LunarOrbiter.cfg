}

// Gamedata/Bluedog_DB/Parts/ProbeExpansion/LunarOrbiter/bluedog_LunarOrbiter_Camera.cfg
@PART[bluedog_LunarOrbiter_Camera]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Codac-LO-2180 "Eastkan" 胶片相机
    @manufacturer = Bluedog 设计局
    @description = 传统胶片相机需要把胶片送回 Kerbin 冲洗，限制了远距离探测。为了更清楚地了解深空，我们与 Codac 合作研制了这套先进胶片相机。曝光后，胶片会自动冲洗，再由早期光学扫描器逐条扫描传回。这个过程会损失大量细节，因此影像价值不及直接回收胶片。冲洗后的胶片仍会保存下来，若能带回地面，也可继续研究。有趣的是，相机外壳内还装有盖革计数器，用于测量辐射。
    @MODULE[DMModuleScienceAnimateGeneric]:HAS[#experimentID[bd_camera]]
    {
        @endEventGUIName = 收回
        @startEventGUIName = 展开
        @toggleEventGUIName = 切换孔径
        @collectActionName = 采集照片
        @experimentActionName = 拍摄照片
        @resetActionName = 重置相机
        @reviewActionName = 查看照片
    }
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[bd_GeigerCounter]]
    {
        @experimentActionName = 启用盖革计数器
        @resetActionName = 删除数据
        @collectActionName = 获取数据
    }
    @tags ^= :$: 探测器 卫星 胶片相机:
}

// Gamedata/Bluedog_DB/Parts/ProbeExpansion/LunarOrbiter/bluedog_LunarOrbiter_Core.cfg
@PART[bluedog_LunarOrbiter_Core]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Codac-PCT "Kreuznach" 探测器核心
    @manufacturer = Bluedog 设计局
    @description = 独特的探测器核心，航电和控制系统围绕桁架布置，将内部空间留给相机等实验仪器。外侧环带可安装折叠太阳能电池板和通信设备。通常倒置装在 Belle 上面级内部发射，可切换控制方向以适应这一布局，也能在飞行中切换回来。
    @MODULE[ModuleCommand]
    {
        @defaultControlPointDisplayName = 前向
        @CONTROLPOINT[reverse]
        {
            @displayName = 反向
        }
    }
    @MODULE[ModuleSAS]
    {
        @UPGRADES
        {
            @UPGRADE,0
            {
                @description__ = SAS 升级
            }
            @UPGRADE,1
            {
                @description__ = SAS 升级
            }
            @UPGRADE,2
            {
                @description__ = SAS 升级
            }
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchNodes]]
    {
        @uiGroupDisplayName = 连接节点
        @switcherDescription = 太阳能板节点
        @switcherDescriptionPlural = 太阳能板节点
        @SUBTYPE[Yes]
        {
            %title = 有
        }
        @SUBTYPE[No]
        {
            %title = 无
        }
    }
    @tags ^= :$: 探测器 卫星 探测器核心:
}

