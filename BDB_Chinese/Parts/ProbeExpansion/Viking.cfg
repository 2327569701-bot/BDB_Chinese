            @descriptionSummary = 将部件对称模式设为 4x。
            @descriptionDetail = 便于安装太阳能电池板。若只需将四块电池板中的一块换成其他构型，请先对待替换电池板使用“移出对称组”，再以 1x 对称模式安装替代件。
