    @manufacturer = Bluedog 设计局
    @description = 面向 Kerbin 静止轨道通信的大型复合天线阵列，包括五副高增益 UHF 螺旋天线、两副低增益 X 波段喇叭天线，以及一副负责遥测和控制的双锥天线。可折叠收纳进 1.875m 整流罩，为 HGHS-318 “Botte” 卫星平台设计，具备跟踪 Kerbin 的能力。
