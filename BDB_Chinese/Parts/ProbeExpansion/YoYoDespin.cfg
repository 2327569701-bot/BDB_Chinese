@PART[bluedog_YoYoDespin]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Y0-Y0 消旋装置
    @manufacturer = Bluedog 设计局
    @description = 触发分级后，这枚小配重会沿刚性杆向外移动，随后脱离。由于角动量等于质量乘速度再乘半径，在角动量守恒的条件下，增大半径可降低角速度。严格来说，这并非真正的悠悠式消旋装置，因为配重完全伸出时不会突然绷紧，从而停止或反转自旋。务必以对称方式安装。典型用法是将 0.3125 起旋发动机分离器装在固体末级（Staara 20）底部，将消旋装置装在固体末级或载荷侧面。先用起旋发动机使飞行器自旋，再点燃固体末级；燃烧结束后，展开消旋装置以降低转速。
    @MODULE[ModuleBdbDecouplerAnimation]:HAS[#animationName[deploy]]
    {
        @flightGUIName = 展开
        @stagingEnableText = 启用分级消旋
        @stagingDisableText = 禁用分级消旋
        %editorGUIName = 切换展开状态
    }
    @tags ^= :$: 探测器 卫星 消旋装置:
}

