        @endEventGUIName = 收回磁强计
        @startEventGUIName = 展开磁强计
        @toggleEventGUIName = 切换磁强计
        @collectActionName = 收集数据
        @experimentActionName = 记录磁强计数据
        @resetActionName = 重置实验
        @reviewActionName = 查看数据
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchType]]
    {
        @switcherDescription = 类型
        %uiGroupDisplayName = 部件切换
    }
    @tags ^= :$: 探测器 卫星 磁强计伸杆:
}

