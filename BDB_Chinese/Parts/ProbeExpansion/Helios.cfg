// Gamedata/Bluedog_DB/Parts/ProbeExpansion/Helios/bluedog_Helios_Core.cfg
@PART[bluedog_Helios_Core]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Sonne-MBM-HEOS 探测器核心
    @manufacturer = Bluedog 设计局
    @description = Sonne 航天器使用的 0.9375m 探测器核心，由 BDB 与日耳曼合作伙伴联合研制。在上下两端各安装一块遮阳罩，下方那块需翻转，以组成沙漏形外观，再安装实验伸杆和 RPWS 天线。内置宇宙射线探测器，也包含微流星体探测器，但后者需要独立的 Sonne 实验组件才能开展实验。
    @MODULE[ModuleSAS]
    {
        @UPGRADES
        {
            @UPGRADE,0
            {
                @description__ = SAS 升级
            }
            @UPGRADE,1
            {
                @description__ = SAS 升级
            }
            @UPGRADE,2
            {
                @description__ = SAS 升级
            }
        }
    }
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[bd_cosmicRay]]
    {
        @experimentActionName = 记录宇宙射线数据
        @resetActionName = 删除数据
        @collectActionName = 获取数据
    }
    @MODULE[ModuleB9AssignUiGroups]
    {
        @MODULE
        {
            @uiGroupDisplayName = 科学实验
        }
    }
    @tags ^= :$: 探测器 卫星 探测器核心:
}

