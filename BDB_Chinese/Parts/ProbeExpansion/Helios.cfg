// Gamedata/Bluedog_DB/Parts/ProbeExpansion/Helios/bluedog_Helios_Magnetometer.cfg
@PART[bluedog_Helios_Magnetometer]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Sonne-MBM-MEB 磁强计伸杆
    @manufacturer = DMagic 与 Bluedog 设计局
    @description = Sonne 航天器使用的大型伸展臂磁强计，由 BDB 与条顿合作方共同研制。利用预设安装板，在 HEOS 探测器核心两侧各安装一台。提供两种不同磁强计构型，应各用一台。
