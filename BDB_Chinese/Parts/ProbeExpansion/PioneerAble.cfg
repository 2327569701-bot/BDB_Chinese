    @manufacturer = Bluedog 设计局
    @description = 这款探测器核心配有第一代 SAS、大容量电池，以及辐射和微流星体撞击实验仪器。虽然设计过于复杂、成本高昂，但在其研制年代已相当先进且能干。它还装有一台朝向逆行方向的单组元推进剂推进器，奇怪的是，却没有自带推进剂……
    @MODULE[ModuleSAS]
    {
        @UPGRADES
        {
            @UPGRADE,0
            {
                @description__ = SAS 升级
            }
            @UPGRADE,1
            {
                @description__ = SAS 升级
            }
            @UPGRADE,2
            {
                @description__ = SAS 升级
            }
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[surfaceSwitch]]
    {
        @switcherDescription = 表面
        @switcherDescriptionPlural = 表面
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[Default]
        {
            %title = 默认
        }
        @SUBTYPE[Thermal?Control?Pinwheels]
        {
            %title = 热控旋叶
        }
    }
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[logmmImpacts]]
    {
        @experimentActionName = 记录撞击
        @resetActionName = 丢弃撞击数据
        @collectActionName = 采集撞击数据
    }
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[bd_GeigerCounter]]
    {
        @experimentActionName = 启用盖革计数器
        @resetActionName = 删除数据
        @collectActionName = 获取数据
    }
    @MODULE[ModuleScienceExperiment]:HAS[#experimentID[bd_TrappedRadiation]]
    {
        @experimentActionName = 俘获辐射测量数据
        @resetActionName = 丢弃俘获辐射数据
        @collectActionName = 获取数据
    }
    @MODULE[ModuleB9AssignUiGroups]
    {
        @MODULE,0
        {
            @uiGroupDisplayName = 科学实验
        }
        @MODULE,1
        {
            @uiGroupDisplayName = 科学实验
        }
        @MODULE,2
        {
            @uiGroupDisplayName = 科学实验
        }
    }
