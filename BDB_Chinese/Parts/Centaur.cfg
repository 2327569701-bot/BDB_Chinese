// Gamedata/Bluedog_DB/Parts/Centaur/bluedog_CentaurD_RL10.cfg
@PART[bluedog_CentaurD_RL10]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Inon-R-10A "Isor" 低温液体火箭发动机
    @manufacturer = Bluedog 设计局
    @description = 使用低温液氢和液氧，可以达到传统推进剂难以企及的效率。R-10A “Isor” 是最早采用这种推进剂组合的上面级发动机。Inon 系列通常使用一台或两台，Sarnus S-IV 则使用六台。请确认相连贮箱装有正确推进剂，并注意低温推进剂会随时间蒸发。提供可切换的升级构型。\nB9PartSwitch：此部件可在零件操作菜单中切换发动机构型，部分构型需要通过升级解锁。
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
    {
        @switcherDescription = 发动机构型
        @switcherDescriptionPlural = 发动机构型
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[RL10-A]
        {
            @descriptionSummary = 低温发动机原型。Isor 结构紧凑，效率很高。
            @descriptionDetail = <b>推力:</b> 0.8 kN 海平面 / 16.675 kN 真空\n<b>比冲:</b> 180 s 海平面 / 425 s 真空
        }
        @SUBTYPE[RL10-A3]
        {
            @descriptionSummary = Isor 发动机的实用型号，用于 Sarnus SIV 和 Inon D、D1、G/T 上面级。
            @descriptionDetail = <b>推力:</b> 0.75 kN 海平面 / 17.1 kN 真空\n<b>比冲:</b> 180 s 海平面 / 432 s 真空
        }
        @SUBTYPE[RL10-A4]
        {
            @descriptionSummary = 比冲与推力均有提升的改进型，用于 Bossart II 火箭的 Inon II 上面级，也可用于升级 Prometheus IV 的 Inon T。
            @descriptionDetail = <b>推力:</b> 1 kN 海平面 / 23 kN 真空\n<b>比冲:</b> 240 s 海平面 / 451 s 真空
        }
        @SUBTYPE[RL10A-4-1N]
        {
            @descriptionSummary = R-10A“Isor”低温发动机的先进版本。R-10A41“Sorau”配有可展开的喷管延伸段，在不增加收拢总高度的情况下，获得大型真空喷管带来的性能提升。
            @descriptionDetail = <b>推力:</b> 0.5 kN 海平面 / 24.5 kN 真空\n<b>比冲:</b> 200 s 海平面 / 451 s 真空
        }
        @SUBTYPE[RL10-C1]
        {
            @descriptionSummary = 以 R-10B2 为基础，采用较短的固定喷管延伸段，用于 Muo-5 火箭的 Inon-V 级。
            @descriptionDetail = <b>推力:</b> 1.1 kN 海平面 / 25.5 kN 真空\n<b>比冲:</b> 150 s 海平面 / 449.7 s 真空
        }
        @SUBTYPE[RL10-A5]
        {
            @descriptionSummary = 采用海平面优化喷管的试验发动机。
            @descriptionDetail = <b>推力:</b> 13.7 kN 海平面 / 16.2 kN 真空\n<b>比冲:</b> 316 s 海平面 / 373 s 真空
        }
        @SUBTYPE[RL10-C3]
        {
            @descriptionSummary = 由 Inon-R-10B2 发展而来，采用略短的固定喷管延伸段。设计用于多机并联，或许会装在某种橙色大火箭的升级上面级上。
            @descriptionDetail = <b>推力:</b> 1.2 kN 海平面 / 27.1 kN 真空\n<b>比冲:</b> 45 s 海平面 / 460 s 真空
        }
        @SUBTYPE[RL10-B2]
        {
            @descriptionSummary = R-10B2“Eisorau”采用更大的喷管延伸段，提高了性能，但也限制了其在某些构型中的安装。
            @descriptionDetail = <b>推力:</b> 0.6 kN 海平面 / 27.5 kN 真空\n<b>比冲:</b> 10 s 海平面 / 462 s 真空
        }
    }
    @tags ^= :$: 半人马 上面级 低温液体火箭发动机:
}

