// Gamedata/Bluedog_DB/Parts/Redstone/bluedog_Redstone_A7_TailUnit.cfg
@PART[bluedog_Redstone_A7_TailUnit]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Etoh-140-TU "Sandstone" 液体火箭发动机
    @manufacturer = Bluedog 设计局
    @description = 这台早期助推发动机最初使用酒精／液氧推进剂，用于 Sandstone 弹道导弹，后来升级为使用挥发性更强的 Hydyne 燃料。它也用于 Hermes Sandstone 运载火箭，但设计师改回了更安全、性能稍逊的酒精／液氧组合。护罩内、喷管下方设有燃气舵，通过偏转发动机排气实现简单的推力矢量控制。另有质量稍轻的无护罩构型，但不具备推力矢量控制。\nB9PartSwitch：此部件可在零件操作菜单中切换发动机构型，部分构型需要通过升级解锁。
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
    {
        @switcherDescription = 发动机构型
        @switcherDescriptionPlural = 发动机构型
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[Redstone_A7]
        {
            @title = Etoh-140 "Sandstone" 发动机
            @descriptionSummary = 最早投入量产的火箭发动机之一。
            @descriptionDetail = <b>推力:</b> 140.1 kN 海平面 / 160 kN 真空\n<b>比冲:</b> 218 s 海平面 / 249 s 真空
        }
        @SUBTYPE[Redstone_A7_2]
        {
            @title = Etoh-148 "Sandstone" 发动机
            @descriptionSummary = 改用更活泼的燃料，提高了推力与比冲。
            @descriptionDetail = <b>推力:</b> 148.1 kN 海平面 / 162 kN 真空\n<b>比冲:</b> 235 s 海平面 / 257 s 真空
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitchShroud]]
    {
        @switcherDescription = 壳体
        @switcherDescriptionPlural = 壳体
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[Default]
        {
            @title = 带罩
        }
        @SUBTYPE[Bare]
        {
            @title = 裸露
            @descriptionSummary = 不带外罩或姿态控制燃气舵的裸发动机。
        }
    }
    @MODULE[ModuleB9AssignUiGroups]
    {
        @MODULE,0
        {
            @uiGroupDisplayName = 推力矢量控制（仅带罩型）
        }
        @MODULE,1
        {
            @uiGroupDisplayName = 推力矢量控制（仅带罩型）
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[textureSwitchPaint]]
    {
        @uiGroupDisplayName = 涂装切换
        @switcherDescription = 涂装
        @switcherDescriptionPlural = 涂装
        @SUBTYPE[White]
        {
            %title = 白色
        }
        @SUBTYPE[Split]
        {
            %title = 分体式
        }
    }
    @tags ^= :$: 红石 运载火箭 液体火箭发动机:
}

