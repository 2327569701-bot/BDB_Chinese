// Gamedata/Bluedog_DB/Parts/Able/bluedog_ThorAble_Tank.cfg
@PART[bluedog_ThorAble_Tank]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Alpha/Daleth 60-85 液体推进剂贮箱
    @manufacturer = Bluedog 设计局
    @description = 这款轻型 0.625m 上面级贮箱由 Easton 第二级稍作改装而成，被借用于 Fenris-Alpha 火箭。Fenris 团队保证，用完就会还给 Easton 团队。它集成三轴姿态控制系统和少量单组元推进剂，还可解锁用于早期 Daleth 上面级的加长版本。
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[realnameTankSwitch]]
    {
        @switcherDescription = 变体
        @switcherDescriptionPlural = 变体
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[Able]
        {
            @descriptionDetail = Fuel load set based on the realisticly scaled Alpha tank size（0.5m 直径）
        }
        @SUBTYPE[Delta]
        {
            @descriptionDetail = Fuel load set based on the realisticly scaled Alpha tank size（0.5m 直径）
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[textureSwitchPaint]]
    {
        @uiGroupDisplayName = 涂装切换
        @switcherDescription = 涂装
        @switcherDescriptionPlural = 涂装
        @SUBTYPE[White]
        {
            %title = 白色
        }
    }
    @tags ^= :$: 航天 部件 液体推进剂贮箱:
}

