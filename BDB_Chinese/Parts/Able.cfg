@PART[bluedog_Able_Engine]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = JA10-37-6 "Alpha" 液体火箭发动机
    @manufacturer = Bluedog 设计局
    @description = 早期上面级发动机。喷管针对真空性能设计，不要在大气层内点火。它的推力和效率都算不上出众，不过总是个好的开始。用于 Easton 和 Fenris 火箭的 Alpha 上面级；也提供适用于早期 Daleth 火箭及 Alphastar 的升级型号。\nB9PartSwitch：此部件可在零件操作菜单中切换发动机构型，部分构型需要通过升级解锁。
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
    {
        @switcherDescription = 发动机构型
        @switcherDescriptionPlural = 发动机构型
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[AbleAJ10-37]
        {
            @title = Easton-12-37 "Alpha" 液体火箭发动机
        }
        @SUBTYPE[AbleAJ10-118D]
        {
            @title = Daleth-12-118D "Alpha" 液体火箭发动机
        }
        @SUBTYPE[AblestarAJ10-104]
        {
            @title = Fenris-18-104 "Alphastar" 液体火箭发动机
        }
        @SUBTYPE[AblestarAJ10-118E]
        {
            @title = Fenris-18-118E "Alphastar" 液体火箭发动机
        }
    }
    @tags ^= :$: 航天 部件 液体火箭发动机:
}

