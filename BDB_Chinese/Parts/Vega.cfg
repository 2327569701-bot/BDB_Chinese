// Gamedata/Bluedog_DB/Parts/Vega/bluedog_Vega_GE405H.cfg
@PART[bluedog_Vega_GE405H]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Vejur-E78 "Decker" 液体火箭发动机
    @manufacturer = Bluedog 设计局
    @description = Vejur 是最早设计的大型上面级之一，原计划在 Inon 投入使用之前过渡使用。机密军用上面级 Belle 向航天项目开放销售后，Vejur 一度停止研制，直到投资方出资才得以完成。“Decker”由“Viking”发动机改装而来，因此效率不及专门设计的上面级发动机。\nB9PartSwitch：此部件可在零件操作菜单中切换发动机构型，部分构型需要通过升级解锁。
    @MODULE[ModuleB9AssignUiGroups]
    {
        @MODULE,0
        {
            @uiGroupDisplayName = 发动机
        }
        @MODULE,1
        {
            @uiGroupDisplayName = 发动机
        }
        @MODULE,2
        {
            @uiGroupDisplayName = 游机发动机
        }
    }
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
    {
        @switcherDescription = 发动机构型
        @switcherDescriptionPlural = 发动机构型
        %uiGroupDisplayName = 部件切换
    }
    @tags ^= :$: 航天 部件 液体火箭发动机:
}

