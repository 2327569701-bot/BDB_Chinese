// Gamedata/Bluedog_DB/Parts/Agena/bluedog_Agena_Engine_XLR81.cfg
@PART[bluedog_Agena_Engine_XLR81]:NEEDS[Bluedog_DB]:LAST[zzzBDB_Chinese]
{
    @title = Belle-RLX81 液体火箭发动机系列
    @manufacturer = Bluedog 设计局
    @description = 为 Belle 上面级／航天器系列研制的通用发动机系列，具有多项区别于其他小型真空发动机的设计特点。采用燃气发生器循环而非挤压式供给，有利于降低整个级段的干质量；各次改进还显著提高了比冲。\nB9PartSwitch：此部件可在零件操作菜单中切换发动机构型，部分构型需要通过升级解锁。
    @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
    {
        @switcherDescription = 发动机构型
        @switcherDescriptionPlural = 发动机构型
        %uiGroupDisplayName = 部件切换
        @SUBTYPE[8048]
        {
            @descriptionSummary = RLX81 的早期型号，用于 Belle-A 上面级。全铝结构使这台发动机成为颇为出色的技术成果。
            @descriptionDetail = <b>推力:</b> 17.2 kN 真空\n<b>比冲:</b> 94 s 海平面 / 272 s 真空
        }
        @SUBTYPE[8081]
        {
            @descriptionSummary = RLX81 的早期型号，用于首批量产的 Belle-B 上面级。以更大的延伸段替换喷管下段后，性能显著提高。
            @descriptionDetail = <b>推力:</b> 17.7 kN 真空\n<b>比冲:</b> 91 s 海平面 / 283 s 真空
        }
        @SUBTYPE[8096]
        {
            @descriptionSummary = RLX81 的实用型号，用于“标准化”的 Belle-D 及后期 Belle-B 上面级。相较于前代，各方面均有改进，喷管也进一步加大。
            @descriptionDetail = <b>推力:</b> 17.8 kN 真空\n<b>比冲:</b> 84 s 海平面 / 291 s 真空
        }
        @SUBTYPE[8096HDA]
        {
            @descriptionSummary = 改用“高密度酸”推进剂以提高性能的 Mafuni 发动机。
            @descriptionDetail = <b>推力:</b> 18.8 kN 真空\n<b>比冲:</b> 76 s 海平面 / 302 s 真空
        }
        @SUBTYPE[8096B]
        {
            @descriptionSummary = 配有长喷管延伸段的 Mafuni 发动机，用于带可抛贮箱的先进 Belle 上面级。
            @descriptionDetail = <b>推力:</b> 19.5 kN 真空\n<b>比冲:</b> 62 s 海平面 / 327 s 真空
        }
        @SUBTYPE[8096C]
        {
            @descriptionSummary = 专用 Mafuni 发动机，采用缩小并优化的推力室和大型喷管延伸段，在所用推进剂条件下实现了很高的比冲。为此牺牲了整整四分之一的推力。
            @descriptionDetail = <b>推力:</b> 13.3 kN 真空\n<b>比冲:</b> 57 s 海平面 / 336 s 真空
        }
    }
    @tags ^= :$: 阿金纳 上面级 液体火箭发动机系列:
}

